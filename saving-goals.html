<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Saving Goals - KantongKu</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #e6f0ea;
    }
  </style>
</head>
<body class="min-h-screen p-6">

  <main class="grid grid-cols-1 md:grid-cols-2 gap-6 max-w-7xl mx-auto">
    <!-- Add Saving Goal Form -->
    <section class="bg-white rounded-lg shadow-lg p-6">
      <h2 class="text-lg font-semibold text-green-900 mb-4">Saving Goals</h2>
      <form class="space-y-6">
        <div>
          <label for="goalName" class="block text-gray-700 font-semibold mb-2">Goal Name</label>
          <input type="text" id="goalName" name="goalName" placeholder="Enter goal name" class="w-full border border-gray-300 rounded px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-500" />
        </div>
        <div>
          <label for="targetAmount" class="block text-gray-700 font-semibold mb-2">Target Amount</label>
          <input type="number" id="targetAmount" name="targetAmount" placeholder="Enter target amount" class="w-full border border-gray-300 rounded px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-500" />
        </div>
        <div>
          <label for="deadline" class="block text-gray-700 font-semibold mb-2">Deadline</label>
          <input type="date" id="deadline" name="deadline" class="w-full border border-gray-300 rounded px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-500" />
        </div>
        <button type="submit" class="bg-green-600 text-white px-6 py-2 rounded hover:bg-green-700 transition">Save Saving</button>
      </form>
    </section>

    <!-- Other Savings Panel -->
    <section class="bg-white rounded-lg shadow-lg p-6">
      <h2 class="text-lg font-semibold text-green-900 mb-4">Other Savings</h2>
      <div class="space-y-6">
        <div>
          <h3 class="font-semibold text-green-900 mb-1">Car Fund</h3>
          <p class="text-sm text-gray-600 mb-2">Saving for a new car</p>
          <div class="w-full bg-green-200 rounded-full h-4">
            <div class="bg-green-600 h-4 rounded-full" style="width: 50%;"></div>
          </div>
          <p class="text-sm text-green-700 mt-1">50% saved</p>
        </div>
        <div>
          <h3 class="font-semibold text-green-900 mb-1">Home Renovation</h3>
          <p class="text-sm text-gray-600 mb-2">Saving for home improvements</p>
          <div class="w-full bg-green-200 rounded-full h-4">
            <div class="bg-green-600 h-4 rounded-full" style="width: 30%;"></div>
          </div>
          <p class="text-sm text-green-700 mt-1">30% saved</p>
        </div>
      </div>
    </section>
  </main>

</body>
</html>

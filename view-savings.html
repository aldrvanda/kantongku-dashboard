<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>View Savings - KantongKu</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #e6f0ea;
    }
  </style>
</head>
<body class="min-h-screen p-6">

  <header class="mb-6">
    <h1 class="text-2xl font-semibold text-green-900">View Savings</h1>
  </header>

  <main class="grid grid-cols-1 md:grid-cols-3 gap-6 max-w-7xl mx-auto">
    <!-- Saving Goal 1 -->
    <section class="bg-white rounded-lg shadow-lg p-6">
      <h2 class="text-lg font-semibold text-green-900 mb-2">Vacation Fund</h2>
      <p class="text-sm text-gray-600 mb-4">Save for a trip to Bali</p>
      <div class="w-full bg-green-200 rounded-full h-4 mb-2">
        <div class="bg-green-600 h-4 rounded-full" style="width: 70%;"></div>
      </div>
      <p class="text-sm text-green-700">70% saved</p>
    </section>

    <!-- Saving Goal 2 -->
    <section class="bg-white rounded-lg shadow-lg p-6">
      <h2 class="text-lg font-semibold text-green-900 mb-2">Emergency Fund</h2>
      <p class="text-sm text-gray-600 mb-4">Save for unexpected expenses</p>
      <div class="w-full bg-green-200 rounded-full h-4 mb-2">
        <div class="bg-green-600 h-4 rounded-full" style="width: 40%;"></div>
      </div>
      <p class="text-sm text-green-700">40% saved</p>
    </section>

    <!-- Saving Goal 3 -->
    <section class="bg-white rounded-lg shadow-lg p-6">
      <h2 class="text-lg font-semibold text-green-900 mb-2">Car Fund</h2>
      <p class="text-sm text-gray-600 mb-4">Saving for a new car</p>
      <div class="w-full bg-green-200 rounded-full h-4 mb-2">
        <div class="bg-green-600 h-4 rounded-full" style="width: 50%;"></div>
      </div>
      <p class="text-sm text-green-700">50% saved</p>
    </section>
  </main>

</body>
</html>
